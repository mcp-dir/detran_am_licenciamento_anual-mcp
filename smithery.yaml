name: detran_am_licenciamento_anual-mcp
displayName: "DETRAN AM: Licenciamento Anual"
description: >
  DETRAN AM: Licenciamento Anual, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
